razorpay.key.id=rzp_test_TclA6EXFI8dtGm
razorpay.key.secret=Iz4uV8YushWxzZ4Me8091FPp

# --- Email notifications ---
# Order confirmation / status update emails. Using Gmail SMTP here since
# it's free and works for a small store without a dedicated email service -
# for higher volume later, swap to SendGrid/SES/Mailgun instead (same
# JavaMailSender interface, just different host/port/credentials below).
#
# To actually send emails, you need a Gmail "App Password" (NOT your normal
# Gmail password - Google blocks plain-password SMTP login):
#   1. Turn on 2-Step Verification on the Gmail account you want to send from:
#      https://myaccount.google.com/security
#   2. Create an App Password: https://myaccount.google.com/apppasswords
#   3. Replace the placeholders below with that Gmail address and the
#      16-character app password it gives you (not your real password).
#
# Until you do this, the app will log a warning and skip sending rather
# than crash - see EmailService for that fallback behavior.










spring.application.name=MyProject
 
# ---------------------------------------------------------------
# SECRETS are NOT stored in this file. Put them in
#   ./application-secrets.properties   (git-ignored, see the .example file)
# or in environment variables (DB_PASSWORD, JWT_SECRET, ...).
# If one is missing the app refuses to start with a clear
# "Could not resolve placeholder" message, which is what you want.
# ---------------------------------------------------------------
spring.config.import=optional:file:./application-secrets.properties
 
# --- Datasource (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/myProject
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
 
# --- JPA / Hibernate ---
# 'update' is fine while developing; for production use Flyway/Liquibase migrations instead.
spring.jpa.hibernate.ddl-auto=update
# Set both to true only while debugging SQL (very noisy).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false
 
# Runs data.sql on EVERY start (spring.sql.init.mode=always). Keep it only if that script
# is idempotent (e.g. INSERT ... ON CONFLICT DO NOTHING) and holds no real passwords.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
 
# --- Messages ---
spring.messages.basename=messages
spring.messages.encoding=UTF-8
 
# --- JWT ---
# Must be a long random string (32+ chars). Generate one with:  openssl rand -base64 48
jwt.secret=${JWT_SECRET}
# milliseconds (86400000 = 24 hours). Shorter is safer.
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
 
# --- Server ---
server.port=8080
logging.level.org.springframework.security=INFO
# Do NOT enable spring.data.web.pageable.serialization-mode=via-dto: it nests pagination under
# "page" and breaks the Angular Page<T> parsing (flat totalElements/totalPages is expected).
 
# --- CORS (comma-separated list of allowed frontend origins) ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4500}
 
# --- Product image uploads ---
# Absolute path outside the project so uploads survive re-extracting the project.
app.upload.dir=${UPLOAD_DIR:C:/ecommerce-uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Razorpay (use TEST keys until the webhook is verified; never commit keys) ---
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}
 
# --- Email (Gmail needs an App Password, not your normal password) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from-name=ShopSphere
# Set to true once MAIL_USERNAME / MAIL_APP_PASSWORD are filled in.
app.mail.enabled=${APP_MAIL_ENABLED:false}
 