# --- Email notifications ---
# Order confirmation / status update emails. Using Gmail SMTP here since
# it's free and works for a small store without a dedicated email service -
# for higher volume later, swap to SendGrid/SES/Mailgun instead (same
# JavaMailSender interface, just different host/port/credentials below).
#
# To actually send emails, you need a Gmail "App Password" (NOT your normal
# Gmail password - Google blocks plain-password SMTP login):
#   1. Turn on 2-Step Verification on the Gmail account you want to send from:
#      https://myaccount.google.com/security
#   2. Create an App Password: https://myaccount.google.com/apppasswords
#   3. Replace the placeholders below with that Gmail address and the
#      16-character app password it gives you (not your real password).
#
# Until you do this, the app will log a warning and skip sending rather
# than crash - see EmailService for that fallback behavior.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=REPLACE_WITH_YOUR_GMAIL_ADDRESS@gmail.com
spring.mail.password=REPLACE_WITH_YOUR_16_CHAR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Shown in the "From" field of every email sent - can differ from your
# actual store name if you like, but keep it recognizable to customers.
app.mail.from-name=ShopSphere
app.mail.enabled=false
