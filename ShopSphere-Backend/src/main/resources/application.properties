spring.application.name=MyProject

# --- Datasource Configuration (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/myProject
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA/Hibernate Configuration ---
#spring.jpa.hibernate.ddl-auto=create

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Make sure this is 'update' so it doesn't wipe the file you just ran
spring.jpa.hibernate.ddl-auto=update

# Tell Hibernate to run the import.sql script
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.jpa.open-in-view=false

# --- Message Source Configuration ---
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# --- JWT Configuration ---
jwt.secret=myVerySecretKeyThatMustBeAtLeast64CharactersLongForProduction1234567890abcdef
jwt.expiration=86400000

# --- Server ---
server.port=8080
logging.level.org.springframework.security=DEBUG
# NOTE: intentionally NOT using spring.data.web.pageable.serialization-mode=via-dto.
# That mode nests pagination metadata under a "page" sub-object
# (data.page.totalElements / data.page.totalPages) instead of the classic
# flat shape (data.totalElements / data.totalPages). The Angular frontend's
# Page<T> interface (product-service.ts) and its parsing in both
# product-dashboard.ts and admin-dashboard.ts expect the flat shape - with
# via-dto active, totalPages silently read as undefined and fell back to 1
# every time, which is exactly why pagination controls never appeared on
# either the customer product page or the admin product tab, regardless of
# how many products actually existed.
# --- Product image uploads ---
# Filesystem directory (relative to where the app runs) where uploaded
# product images are stored. Served back out at /images/** alongside the
# original seed images bundled in classpath resources (see WebConfig).
#
# WARNING: this is a RELATIVE path, so it depends on the app's working
# directory and will be recreated empty if you ever delete/re-extract the
# project folder - any previously uploaded product images will be gone,
# since this folder only exists at runtime and was never part of the
# project source. To make uploads survive that, change this to an ABSOLUTE
# path outside your project folder, e.g.:
#   Windows: app.upload.dir=C:/ecommerce-uploads
#   Mac/Linux: app.upload.dir=/var/ecommerce-uploads
#
# Set to an absolute path (Windows, based on your setup) so uploaded
# product images survive no matter how many times the project folder
# itself gets replaced with a new zip. Change this path if you'd prefer
# a different location - just create the folder once and it'll be used
# from then on.
app.upload.dir=C:/ecommerce-uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

