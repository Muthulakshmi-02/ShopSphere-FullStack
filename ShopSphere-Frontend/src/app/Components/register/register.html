<div class="register-wrapper">
  <div class="register-container">

    <!-- Brand -->
    <div class="register-brand">
      <div class="logo">🛒</div>
      <h1>ShopSphere</h1>
    </div>

    <!-- Header -->
    <div class="register-header">
      <h2>Create Account</h2>
      <p>Join our marketplace</p>
    </div>

    <!-- Error -->
    @if (errorMessage()) {
    <div class="alert-error" role="alert">{{ errorMessage() }}</div>
    }

    <!-- Form -->
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <div class="input-group">
        <input type="text" formControlName="userName" placeholder="Full Name" autocomplete="name" aria-label="Full name"
          [class.error]="fieldError('userName')" />
        @if (fieldError('userName'); as msg) {
        <span class="error-text">{{ msg }}</span>
        }
      </div>

      <div class="input-group">
        <input type="email" formControlName="email" placeholder="Email" autocomplete="email" aria-label="Email"
          [class.error]="fieldError('email')" />
        @if (fieldError('email'); as msg) {
        <span class="error-text">{{ msg }}</span>
        }
      </div>

      <div class="input-group">
        <input [type]="showPassword() ? 'text' : 'password'" formControlName="password" placeholder="Password"
          autocomplete="new-password" aria-label="Password" [class.error]="fieldError('password')" />
        <button type="button" class="password-toggle" (click)="togglePassword()"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">👁️</button>
        @if (fieldError('password'); as msg) {
        <span class="error-text">{{ msg }}</span>
        }
      </div>

      <button type="submit" [disabled]="isLoading() || registerForm.invalid">
        @if (isLoading()) {
        <span class="spinner"></span> Creating...
        } @else {
        Create Account
        }
      </button>
    </form>

    <!-- Footer -->
    <div class="register-footer">
      <p>Have account? <a routerLink="/login">Sign In</a></p>
    </div>
  </div>
</div>
