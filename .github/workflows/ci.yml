name: ShopSphere CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-check:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./ShopSphere-Backend/mvnw

      - name: Compile and Test Backend
        working-directory: ./ShopSphere-Backend
        run: ./mvnw clean test-compile test -B

  frontend-check:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './ShopSphere-Frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./ShopSphere-Frontend
        run: npm ci

      - name: Build Frontend for Production
        working-directory: ./ShopSphere-Frontend
        run: npm run build -- --configuration production
